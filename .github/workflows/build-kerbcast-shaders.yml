name: build-kerbcast-shaders

# Builds the kerbcast-shaders AssetBundle for Linux, Windows and macOS using
# Unity 2019.4 LTS, matching KSP 1.12.5's engine version. Shader variants are
# compiled per build target, so each platform needs its own bundle file.
# Output ships alongside the plugin as GameData/Kerbcast/kerbcast-shaders
# (Linux keeps the legacy unsuffixed name so existing installs are untouched)
# plus kerbcast-shaders.windows and kerbcast-shaders.osx, following the
# HullcamShaders/shaders.linux platform-suffix precedent.
#
# Runner split: the Linux job builds the Linux + macOS bundles; the Windows
# bundle builds on a windows-2022 runner. It used to cross-compile on the
# Linux editor (Hub windows-mono module), but the 2019.4 Linux toolchain
# emitted d3d11 vertex shader blobs the Windows D3D11 runtime rejects at
# draw time with E_INVALIDARG (0x80070057) while shader.isSupported stayed
# true. Field result in v0.19.0: every kerbcast-bundle camera (NightVision
# class) streamed black and KSP.log filled with 470k "ShaderProgram is
# unsupported" lines. Building on a real Windows editor uses the real
# Windows shader compiler, and the smoke test there executes the d3d11
# blobs on the runner's WARP rasterizer, where Create*Shader validates the
# bytecode the Linux run never could. The macOS metal cross-compile from
# Linux carries the same theoretical risk; macOS is tier-2, has no field
# failure, and the plugin's KerbcastFxAssets render probe degrades a bad
# bundle gracefully at runtime, so it stays on the Linux job for now.
#
# Blocking checks: bundle builds, a per-shader render smoke test on each
# just-built bundle (glcore for Linux, d3d11 for Windows), and the Hullcam
# blit determinism test. The slow FX preview rendering lives in the
# non-blocking fx-previews.yml workflow, which runs after this one succeeds.
#
# Auth: uses buildalon/activate-unity-license@v2 with UNITY_USERNAME +
# UNITY_PASSWORD repo secrets. Same pattern as build-hullcam-shaders.yml.
# build-windows needs:builds-unix partly for fail-fast, partly so the two
# jobs never hold the Unity Personal license concurrently.
#
# Trigger: manual via workflow_dispatch, and on push to the shader sources
# or this workflow file.

on:
  push:
    paths:
      - 'ci/kerbcast-shaders/**'
      # Shared sources the Unity project compiles via Assets/Editor symlinks,
      # and the committed Hullcam shader bundle the determinism test loads.
      - 'Plugin/Kerbcast/Fx/Core/**'
      - 'Plugin/Kerbcast/HullcamBlit/**'
      # The capture path's final orientation correction. Shared with the
      # shipped chain, so a change here must re-run the orientation proof.
      - 'Plugin/Kerbcast/CaptureOrientation/**'
      - 'GameData/Kerbcast/HullcamShaders/**'
      - '.github/workflows/build-kerbcast-shaders.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  UNITY_VERSION: 2019.4.40f1 (ffc62b691db5)

jobs:
  build-unix:
    name: Build Linux + macOS shader bundles
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      # No Unity Hub on Linux. Hub is an Electron desktop app; driving it
      # headlessly on a runner is what broke here — the runner image moved to
      # Hub 3.20, which relocated its binary out of /opt/unityhub, and
      # buildalon/unity-setup still probes the old path (upstream
      # buildalon/unity-setup#57; the fix, RageAgainstThePixel/unity-cli#81, is
      # open and unreleased). Even with a pinned pre-3.20 Hub the headless
      # install returned in 3 seconds having installed nothing.
      #
      # We already pin the exact version AND changeset, and Unity publishes both
      # as plain tarballs, so fetch them directly: deterministic, cacheable, and
      # immune to Hub/runner drift. Only the licence still has to reach Unity.
      - name: Resolve Unity version + changeset
        id: unity
        run: |
          set -eu
          FULL="${{ env.UNITY_VERSION }}"          # e.g. "2019.4.40f1 (ffc62b691db5)"
          VER="${FULL%% *}"
          CS="$(printf '%s' "$FULL" | sed -E 's/.*\(([0-9a-f]+)\).*/\1/')"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "changeset=$CS" >> "$GITHUB_OUTPUT"
          echo "resolved Unity $VER changeset $CS"

      - name: Restore cached Unity Editor
        id: unity-cache
        uses: actions/cache@v4
        with:
          path: ~/unity-editor
          key: unity-linux-${{ steps.unity.outputs.version }}-${{ steps.unity.outputs.changeset }}-mac-mono-v1

      - name: Download Unity Editor + Mac support (cache miss only)
        if: steps.unity-cache.outputs.cache-hit != 'true'
        env:
          VER: ${{ steps.unity.outputs.version }}
          CS: ${{ steps.unity.outputs.changeset }}
        run: |
          set -eux
          sudo apt-get update -qq
          sudo apt-get install -y libarchive-tools cpio
          BASE="https://download.unity3d.com/download_unity/${CS}"
          mkdir -p ~/unity-editor
          # The editor itself ships as a plain Linux tarball.
          curl -fsSL --retry 3 --retry-delay 5 \
            "${BASE}/LinuxEditorInstaller/Unity.tar.xz" -o /tmp/unity.tar.xz
          tar -xf /tmp/unity.tar.xz -C ~/unity-editor
          rm -f /tmp/unity.tar.xz
          # Mac mono support lets this Linux editor compile the metal variants
          # for the macOS bundle. Unity publishes NO Linux-hosted build of that
          # module for 2019.4 — verified, LinuxEditorTargetInstaller 404s and
          # only the macOS .pkg exists — so unpack the .pkg by hand. It is a xar
          # archive whose Payload is a gzipped cpio of the playback engine's
          # CONTENTS; PackageInfo gives install-location
          # /Applications/Unity/PlaybackEngines/MacStandaloneSupport, which on a
          # Linux editor is Editor/Data/PlaybackEngines/MacStandaloneSupport.
          curl -fsSL --retry 3 --retry-delay 5 \
            "${BASE}/MacEditorTargetInstaller/UnitySetup-Mac-Mono-Support-for-Editor-${VER}.pkg" \
            -o /tmp/mac-mono.pkg
          rm -rf /tmp/macx && mkdir -p /tmp/macx
          ( cd /tmp/macx && bsdtar -xf /tmp/mac-mono.pkg TargetSupport.pkg.tmp/Payload )
          DEST=~/unity-editor/Editor/Data/PlaybackEngines/MacStandaloneSupport
          mkdir -p "$DEST"
          gunzip -dc /tmp/macx/TargetSupport.pkg.tmp/Payload | ( cd "$DEST" && cpio -idmu --quiet )
          rm -rf /tmp/macx /tmp/mac-mono.pkg
          test -f "$DEST/modules.asset"
          echo "mac-mono module installed:"; ls "$DEST" | head -5

      - name: Locate the editor binary
        run: |
          set -eu
          EDITOR="$(find ~/unity-editor -maxdepth 3 -type f -name Unity -perm -u+x | head -1)"
          test -n "$EDITOR"
          echo "UNITY_EDITOR_PATH=$EDITOR" >> "$GITHUB_ENV"
          echo "editor: $EDITOR"
          "$EDITOR" -version 2>/dev/null || true

      # Unity refuses to run headless without the graphics/audio libs the
      # Hub install would have pulled in as dependencies.
      - name: Install Unity runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libgtk-3-0 libnss3 libasound2 libgconf-2-4 libxtst6 libxss1 \
            libgbm1 libnotify4 xvfb desktop-file-utils || true

      # Activate against the editor directly, not via Hub's Licensing Client.
      # 2019.4 predates that client — it uses the legacy flow, which the editor
      # binary performs itself — and buildalon/activate-unity-license refuses to
      # run without Hub installed ("Unity Hub is not installed or not
      # accessible"). Since we no longer install Hub, do it the 2019 way.
      - name: Activate Unity Personal license
        env:
          UNITY_USERNAME: ${{ secrets.UNITY_USERNAME }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -eu
          xvfb-run -a "$UNITY_EDITOR_PATH" \
            -batchmode -nographics -quit -logFile /tmp/activate.log \
            -username "$UNITY_USERNAME" -password "$UNITY_PASSWORD" || true
          # The editor's exit code is unreliable here; the licence file is the
          # real signal.
          if ls ~/.local/share/unity3d/Unity/Unity_lic.ulf >/dev/null 2>&1; then
            echo "licence activated"
          else
            echo "::error::Unity licence activation failed; see log below"
            tail -40 /tmp/activate.log || true
            exit 1
          fi


      - name: Build kerbcast-shaders AssetBundles (linux, osx)
        working-directory: ci/kerbcast-shaders
        run: |
          "$UNITY_EDITOR_PATH" \
            -batchmode -nographics -quit \
            -projectPath "$(pwd)" \
            -executeMethod KerbcastCI.BuildKerbcastShaders.BuildUnix \
            -buildTarget Linux64 \
            -logFile -
          echo "--- output bundles ---"
          ls -la Bundles-linux/ Bundles-osx/

      # Both render tests below need a real graphics device: `-nographics`
      # disables it entirely, turning Camera.Render(), Graphics.Blit and
      # RenderTexture readback into no-ops. xvfb gives the runner a virtual
      # display for the GL context.
      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # Per-shader render smoke test on the just-built Linux bundle: every
      # shader in it must report isSupported, render through a material onto
      # a small deterministic scene, and produce output that is neither the
      # magenta error pattern nor all-zero. This run executes the glcore
      # variants ONLY; it cannot validate the d3d11 blobs in the Windows
      # bundle (see the build-windows job). Judging how the FX actually LOOK
      # stays with the fx-previews.yml renders.
      - name: Shader render smoke test (Linux bundle, glcore)
        working-directory: ci/kerbcast-shaders
        timeout-minutes: 10
        run: |
          xvfb-run -a "$UNITY_EDITOR_PATH" \
            -batchmode -quit \
            -projectPath "$(pwd)" \
            -executeMethod KerbcastCI.ShaderSmoke.RenderAll \
            -buildTarget Linux64 \
            -logFile -

      # Regression net for the per-camera Hullcam filter blit (c00fe16):
      # compiles the plugin's HullcamFilterBlit.cs verbatim (via the
      # Assets/Editor/SharedHullcamBlit symlink), loads the committed
      # GameData/Kerbcast/HullcamShaders/shaders.linux MovieTime shader, and
      # asserts each filter mode's blit output is byte-identical under
      # hostile writes to the shared static material (plus reticle on/off
      # policy vs a no-title baseline, plus a control that the legacy
      # shared-static path visibly flickers). Same xvfb arrangement as the
      # smoke test: -nographics would no-op Graphics.Blit and ReadPixels.
      - name: Hullcam filter blit determinism test
        working-directory: ci/kerbcast-shaders
        timeout-minutes: 10
        run: |
          xvfb-run -a "$UNITY_EDITOR_PATH" \
            -batchmode -quit \
            -projectPath "$(pwd)" \
            -executeMethod KerbcastCI.HullcamBlitDeterminism.RunAll \
            -buildTarget Linux64 \
            -logFile -

      # Camera-orientation proof: a four-corner marker frame blitted through
      # each capture blit branch (plain / NightVision / filter-probe) must come
      # back with every corner unmoved. Catches the NightVision d3d11 upside-
      # down bug (GitHub #5) and exercises the HullcamFilterBlit probe. glcore
      # here; the Windows job runs the d3d11 side. Same xvfb arrangement.
      - name: Camera orientation proof (Linux bundle, glcore)
        working-directory: ci/kerbcast-shaders
        timeout-minutes: 10
        run: |
          xvfb-run -a "$UNITY_EDITOR_PATH" \
            -batchmode -quit \
            -projectPath "$(pwd)" \
            -executeMethod KerbcastCI.CameraOrientation.RenderAll \
            -buildTarget Linux64 \
            -logFile -

      # A Personal licence is seat-limited, so hand it back even if the build
      # fails — otherwise repeated runs exhaust the seats.
      - name: Return Unity license
        if: always()
        continue-on-error: true
        run: |
          xvfb-run -a "$UNITY_EDITOR_PATH" \
            -batchmode -nographics -quit -returnlicense -logFile - || true

      - uses: actions/upload-artifact@v4
        with:
          name: kerbcast-shaders-unix
          path: |
            ci/kerbcast-shaders/Bundles-linux/kerbcast-shaders
            ci/kerbcast-shaders/Bundles-osx/kerbcast-shaders
          if-no-files-found: error
          retention-days: 30

  build-windows:
    name: Build Windows shader bundle
    # Fail-fast on broken shader sources (the unix job is quicker to start)
    # and keep the single Unity Personal license from being activated by two
    # runners at once.
    needs: build-unix
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Set up Unity Hub + Editor
        uses: buildalon/unity-setup@v2
        with:
          unity-version: ${{ env.UNITY_VERSION }}
          version-file: 'None'
          build-targets: StandaloneWindows64
          # NOT cached: a cache-restored Windows Unity install exits
          # instantly without writing a log (installer/registry state is
          # not in the cached directory; run 27330133502 vs the fresh
          # install that passed). Fresh install costs ~10 min per run.
          cache-installation: false

      # Activate against the editor directly, not via Hub's Licensing Client.
      # 2019.4 predates that client — it uses the legacy flow, which the editor
      # binary performs itself — and buildalon/activate-unity-license refuses to
      # run without Hub installed ("Unity Hub is not installed or not
      # accessible"). Since we no longer install Hub, do it the 2019 way.
      - name: Activate Unity Personal license
        env:
          UNITY_USERNAME: ${{ secrets.UNITY_USERNAME }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -eu
          xvfb-run -a "$UNITY_EDITOR_PATH" \
            -batchmode -nographics -quit -logFile /tmp/activate.log \
            -username "$UNITY_USERNAME" -password "$UNITY_PASSWORD" || true
          # The editor's exit code is unreliable here; the licence file is the
          # real signal.
          if ls ~/.local/share/unity3d/Unity/Unity_lic.ulf >/dev/null 2>&1; then
            echo "licence activated"
          else
            echo "::error::Unity licence activation failed; see log below"
            tail -40 /tmp/activate.log || true
            exit 1
          fi


      # Native Windows shader compiler: the whole point of this job. The
      # Linux editor's d3d11 cross-compile shipped invalid vertex shader
      # blobs in v0.19.0 (see the workflow header).
      - name: Build kerbcast-shaders AssetBundle (windows)
        working-directory: ci/kerbcast-shaders
        shell: bash
        run: |
          status=0
          "$UNITY_EDITOR_PATH" \
            -batchmode -nographics -quit \
            -projectPath "$(pwd)" \
            -executeMethod KerbcastCI.BuildKerbcastShaders.BuildWindows \
            -buildTarget Win64 \
            -logFile unity-build.log || status=$?
          cat unity-build.log 2>/dev/null || echo "::error::Unity wrote no log (exit $status): editor launch failed before logging"
          [ "$status" -eq 0 ] || exit "$status"
          echo "--- output bundles ---"
          ls -la Bundles-windows/

      # The same per-shader smoke test the Linux job runs, but on the d3d11
      # variants with a real D3D11 device (the hosted runner's WARP software
      # rasterizer). D3D11 validates shader bytecode inside Create*Shader,
      # so the invalid-blob class that black-screened v0.19.0 fails HERE
      # instead of on a player's machine. No xvfb needed on Windows; just
      # batchmode WITHOUT -nographics so a device exists.
      - name: Shader render smoke test (Windows bundle, d3d11)
        working-directory: ci/kerbcast-shaders
        timeout-minutes: 10
        shell: bash
        env:
          KERBCAST_SMOKE_BUNDLE_DIR: Bundles-windows
        run: |
          status=0
          "$UNITY_EDITOR_PATH" \
            -batchmode -quit \
            -projectPath "$(pwd)" \
            -executeMethod KerbcastCI.ShaderSmoke.RenderAll \
            -buildTarget Win64 \
            -logFile unity-smoke.log || status=$?
          cat unity-smoke.log 2>/dev/null || echo "::error::Unity wrote no log (exit $status): editor launch failed before logging"
          exit "$status"

      # d3d11 side of the camera-orientation proof (see the Linux step). This is
      # where the NightVision branch is expected RED until the shader fix: its
      # vert_img inverts on top-left-origin D3D11. batchmode without -nographics
      # so a real device exists.
      - name: Camera orientation proof (Windows bundle, d3d11)
        working-directory: ci/kerbcast-shaders
        timeout-minutes: 10
        shell: bash
        env:
          KERBCAST_SMOKE_BUNDLE_DIR: Bundles-windows
        run: |
          status=0
          "$UNITY_EDITOR_PATH" \
            -batchmode -quit \
            -projectPath "$(pwd)" \
            -executeMethod KerbcastCI.CameraOrientation.RenderAll \
            -buildTarget Win64 \
            -logFile unity-orient.log || status=$?
          cat unity-orient.log 2>/dev/null || echo "::error::Unity wrote no log (exit $status): editor launch failed before logging"
          exit "$status"

      - uses: actions/upload-artifact@v4
        with:
          name: kerbcast-shaders-windows
          path: ci/kerbcast-shaders/Bundles-windows/kerbcast-shaders
          if-no-files-found: error
          retention-days: 30

  # Merge the per-runner bundles into the single kerbcast-shaders artifact
  # downstream consumers (deck-deploy staging, manual installs) expect, laid
  # out exactly as they land in GameData/Kerbcast/.
  assemble:
    name: Assemble kerbcast-shaders artifact
    needs: [build-unix, build-windows]
    runs-on: ubuntu-22.04
    steps:
      - name: Download per-runner bundles
        uses: actions/download-artifact@v4
        with:
          path: bundles

      - name: Lay out GameData/Kerbcast
        run: |
          set -euo pipefail
          mkdir -p GameData/Kerbcast
          cp bundles/kerbcast-shaders-unix/Bundles-linux/kerbcast-shaders GameData/Kerbcast/kerbcast-shaders
          cp bundles/kerbcast-shaders-unix/Bundles-osx/kerbcast-shaders GameData/Kerbcast/kerbcast-shaders.osx
          cp bundles/kerbcast-shaders-windows/kerbcast-shaders GameData/Kerbcast/kerbcast-shaders.windows
          ls -la GameData/Kerbcast/

      - uses: actions/upload-artifact@v4
        with:
          name: kerbcast-shaders
          path: |
            GameData/Kerbcast/kerbcast-shaders
            GameData/Kerbcast/kerbcast-shaders.windows
            GameData/Kerbcast/kerbcast-shaders.osx
          if-no-files-found: error
          retention-days: 30
